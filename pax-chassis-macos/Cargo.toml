[package]
name = "pax-chassis-macos"
edition = "2021"
version = "0.39.1"
authors = ["Zack Brown <zack@pax.dev>"]
license = "MIT OR Apache-2.0"
homepage = "https://pax.dev/"
repository = "https://www.github.com/paxproject/pax"
description = "Platform-specific chassis allowing Pax cartridges to be executed as native macOS apps"

[lib]
name = "paxchassismacos"
crate-type = ["cdylib", "rlib"]

[dependencies]
pax-chassis-common = { path = "../pax-chassis-common", version="0.39.1" }
pax-runtime = { path = "../pax-runtime", version="0.39.1" }
pax-message = {path = "../pax-message", version="0.39.1"}
lazy_static = "1.4.0"
mut_static = "5.0.0"
flexbuffers = "2.0.0"


[features]
designtime = ["pax-chassis-common/designtime"]

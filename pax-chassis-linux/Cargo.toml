[package]
name = "pax-chassis-linux"
version = "0.39.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Linux Vulkan and DMA-BUF frame delivery for native Pax applications"

[dependencies]
anyhow = "1"
ash = "0.38"
libc = "0.2"
pollster = "0.4"
serde_json = "1"
pax-chassis-common = { path = "../pax-chassis-common", version = "0.39.1" }
pax-gpu = { path = "../pax-gpu", version = "0.39.1" }
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[features]
designtime = ["pax-chassis-common/designtime"]

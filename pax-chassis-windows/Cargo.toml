[package]
name = "pax-chassis-windows"
version = "0.39.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Windows DX12 export and native desktop cartridge integration for Pax"

[dependencies]
pax-chassis-common = { path = "../pax-chassis-common", version = "0.39.1" }
pax-gpu = { path = "../pax-gpu", version = "0.39.1" }
serde_json = "1"
pollster = "0.4"
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[features]
designtime = ["pax-chassis-common/designtime"]

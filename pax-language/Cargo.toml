[package]
name = "pax-language"
version = "0.38.3"
authors = ["Zack Brown <zack@pax.dev>"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://pax.dev/"
repository = "https://www.github.com/paxproject/pax"
description = "Pax language parser"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pest = {version = "2.7.10", features = ["std"], optional = true}
pest_derive = {version = "2.7.10", features = ["std"], optional = true}
serde = { version="1.0.95", features=["derive"]}
pax-runtime-api = {path="../pax-runtime-api", version="0.38.3"}
log = "0.4.20"
syn = { version = "1.0", features = ["full", "parsing", "visit"], optional = true }
color-eyre = { version = "0.6.2", optional = true }
proc-macro2 = { version = "1.0", features = ["span-locations"], optional = true }

[features]
default = ["parser"]
parser = ["dep:pest", "dep:pest_derive", "dep:syn", "dep:color-eyre", "dep:proc-macro2"]

[profile.dev]
debug = false

[package]
name = "store-ownership"
version = "0.39.0"
edition = "2021"
default-run = "store-ownership"

[package.metadata.pax]
title = "Store Ownership"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

[profile.dev]
opt-level = 1

[profile.dev.package.store-ownership]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "store-ownership"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

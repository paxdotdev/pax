[package]
default-run = "mesh-gradients"
name = "mesh-gradients"
version = "0.39.0"
edition = "2021"

[package.metadata.pax]
title = "Mesh Gradients"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package.mesh-gradients]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "mesh-gradients"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

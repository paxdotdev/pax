[package]
name = "materials"
version = "0.39.0"
edition = "2021"
default-run = "materials"

[package.metadata.pax]
title = "Pax Material Demo"
icon = "assets/app-icon.png"

[dependencies]
pax-kit = { version = "0.39.0", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.materials]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "materials"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

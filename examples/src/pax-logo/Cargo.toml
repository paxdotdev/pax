[package]
name = "pax-logo"
version = "0.39.0"
edition = "2021"
default-run = "pax-logo"

[package.metadata.pax]
title = "Animated Pax Logo"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.pax-logo]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "pax-logo"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

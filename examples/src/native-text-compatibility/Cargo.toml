[package]
default-run = "native-text-compatibility"
name = "native-text-compatibility"
version = "0.39.0"
edition = "2021"
publish = false

[package.metadata.pax]
title = "Native Text — Compatibility"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package.native-text-compatibility]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "native-text-compatibility"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

[package]
name = "slot-particles"
version = "0.39.0"
edition = "2021"
default-run = "run"

[package.metadata.pax]
title = "Slot Particles"
icon = "assets/app-icon.png"

[dependencies]
rand = { version = "0.8.5" }
getrandom = { version = "0.2.15", features = ["js"] }
pax-kit = { version = "0.39.0", path="../../../pax-kit" }
fireworks = {version = "0.39.0", path="../fireworks" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.slot-particles]
opt-level = 0

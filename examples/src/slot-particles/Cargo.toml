[package]
name = "slot-particles"
version = "0.38.3"
edition = "2021"
default-run = "run"

[package.metadata.pax]
title = "Slot Particles"
icon = "assets/app-icon.png"

[dependencies]
rand = { version = "0.8.5" }
getrandom = { version = "0.2.15", features = ["js"] }
pax-kit = { version = "0.38.3", path="../../../pax-kit" }
fireworks = {version = "0.38.3", path="../fireworks" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

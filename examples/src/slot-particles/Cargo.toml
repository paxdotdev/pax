[package]
name = "slot-particles"
version = "0.38.3"
edition = "2021"
default-run = "run"

[dependencies]
rand = { version = "0.8.5" }
getrandom = { version = "0.2.15", features = ["js"] }
pax-kit = { version = "0.38.3", path="../../../pax-kit" }
fireworks = {version = "0.38.3", path="../fireworks" }

[lib]
crate-type = ["cdylib", "rlib"]
name = "paxcartridge"

[[bin]]
name = "run"
path = "bin/run.rs"

[profile.dev]
opt-level = 0
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false

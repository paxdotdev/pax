[package]
default-run = "architecture-diagram"
name = "architecture-diagram"
version = "0.39.0"
edition = "2021"
publish = false

[package.metadata.pax]
title = "Pax Architecture"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }
pax-logo = { version = "0.39.0", path = "../pax-logo" }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package.architecture-diagram]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "architecture-diagram"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

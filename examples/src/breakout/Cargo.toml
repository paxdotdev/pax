[package]
name = "breakout"
version = "0.39.0"
edition = "2021"
default-run = "breakout"

[package.metadata.pax]
title = "Breakout"
icon = "assets/app-icon.png"

[dependencies]
rand = { version = "0.8.5", features = ["getrandom"] }
getrandom = { version = "0.2.15", features = ["js"] }
rand_distr = { version = "0.4" }
pax-kit = { version = "0.39.0", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.breakout]
opt-level = 0

[features]
standalone = ["dep:pax-host"]

[[bin]]
name = "breakout"
path = "src/main.rs"
required-features = ["standalone"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
pax-host = { version = "0.39.0", path = "../../../pax-host", optional = true }

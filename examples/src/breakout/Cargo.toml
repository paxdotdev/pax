[package]
name = "breakout"
version = "0.38.3"
edition = "2021"
default-run = "run"

[package.metadata.pax]
title = "Breakout"
icon = "assets/app-icon.png"

[dependencies]
rand = { version = "0.8.5", features = ["getrandom"] }
getrandom = { version = "0.2.15", features = ["js"] }
rand_distr = { version = "0.4" }
pax-kit = { version = "0.38.3", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

[package]
name = "gyro-helper"
version = "0.39.0"
edition = "2021"
default-run = "run"

[package.metadata.pax]
title = "Gyro Helper"
icon = "assets/app-icon.png"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }
wasm-bindgen = "0.2.93"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.gyro-helper]
opt-level = 0

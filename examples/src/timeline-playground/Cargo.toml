[package]
name = "timeline-playground"
version = "0.39.0"
edition = "2021"
default-run = "timeline-playground"

[package.metadata.pax]
title = "Timeline Playground"
icon = "assets/app-icon.png"

[dependencies]
pax-kit = { version = "0.39.0", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.timeline-playground]
opt-level = 0

[features]
standalone = ["pax-kit/host"]

[[bin]]
name = "timeline-playground"
path = "src/main.rs"
required-features = ["standalone"]

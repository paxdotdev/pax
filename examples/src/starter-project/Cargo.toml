[package]
name = "starter-project"
version = "0.39.0"
edition = "2021"
default-run = "run"

[package.metadata.pax]
title = "Starter Project"
icon = "assets/app-icon.png"

[dependencies]
pax-kit = { version = "0.39.0", path="../../../pax-kit"}
fireworks = { version = "0.39.0", path="../fireworks" }
color-picker = { version = "0.39.0", path="../color-picker" }
breakout = { version = "0.39.0", path="../breakout" }
space-game = { version = "0.39.0", path="../space-game" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

[profile.release]
opt-level = 3
lto = "thin"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.starter-project]
opt-level = 0

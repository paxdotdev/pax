[package]
name = "living-quilt"
version = "0.38.3"
edition = "2021"
default-run = "run"

[package.metadata.pax]
title = "Living Quilt"

[dependencies]
rand = "0.8.5"
getrandom = { version = "0.2.15", features = ["js"] }
pax-kit = { version = "0.38.3", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.living-quilt]
opt-level = 0

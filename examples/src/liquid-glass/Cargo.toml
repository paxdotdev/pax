[package]
name = "liquid-glass"
version = "0.39.0"
edition = "2021"
default-run = "liquid-glass"

[dependencies]
pax-kit = { version = "0.39.0", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.liquid-glass]
opt-level = 0

[features]
standalone = ["pax-kit/host"]

[[bin]]
name = "liquid-glass"
path = "src/main.rs"
required-features = ["standalone"]

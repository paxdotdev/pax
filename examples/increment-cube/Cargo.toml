[package]
publish = false
name = "increment-cube"
version = "0.39.1"
edition = "2021"
default-run = "increment-cube"

[package.metadata.pax]
title = "Increment Cube"

[dependencies]
rand = "0.8.5"
getrandom = { version = "0.2.15", features = ["js"] }
pax-kit = { version = "0.39.1", path = "../../pax-kit", features = ["3d", "shaders"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "increment-cube"
path = "src/main.rs"
required-features = ["standalone"]

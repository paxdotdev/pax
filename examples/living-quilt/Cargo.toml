[package]
publish = false
name = "living-quilt"
version = "0.39.1"
edition = "2021"
default-run = "living-quilt"

[package.metadata.pax]
title = "Living Quilt"

[dependencies]
rand = "0.8.5"
getrandom = { version = "0.2.15", features = ["js"] }
pax-kit = { version = "0.39.1", path = "../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "living-quilt"
path = "src/main.rs"
required-features = ["standalone"]

[package]
publish = false
default-run = "viewport-proximity"
name = "viewport-proximity"
version = "0.39.0"
edition = "2021"

[package.metadata.pax]
title = "Close Enough — Viewport Proximity"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "viewport-proximity"
path = "src/main.rs"
required-features = ["standalone"]

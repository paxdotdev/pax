[package]
publish = false
name = "slot-projection-resolver"
version = "0.39.0"
edition = "2021"
default-run = "slot-projection-resolver"

[package.metadata.pax]
title = "Slot Projection Resolver"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "slot-projection-resolver"
path = "src/main.rs"
required-features = ["standalone"]

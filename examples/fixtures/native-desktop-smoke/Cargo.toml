[package]
name = "native-desktop-smoke"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "native-desktop-smoke"

[package.metadata.pax]
title = "Pax native desktop acceptance"

[dependencies]
pax-kit = { path = "../../../pax-kit", version = "0.39.1" }

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "native-desktop-smoke"
required-features = ["standalone"]

[package]
publish = false
name = "photo-picker"
version = "0.39.1"
edition = "2021"
default-run = "photo-picker"

[package.metadata.pax]
title = "Photo Picker"

[package.metadata.pax.ios.info_plist]
NSCameraUsageDescription = "Capture photos when the camera source is selected."

[dependencies]
pax-kit = { version = "0.39.1", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "photo-picker"
path = "src/main.rs"
required-features = ["standalone"]

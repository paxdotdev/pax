[package]
publish = false
name = "pick-up-sticks"
version = "0.39.1"
edition = "2021"
default-run = "pick-up-sticks"

[package.metadata.pax]
title = "Pick Up Sticks"
icon = "assets/app-icon.png"

[dependencies]
pax-kit = { version = "0.39.1", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "pick-up-sticks"
path = "src/main.rs"
required-features = ["standalone"]

[package]
default-run = "architecture-diagram"
name = "architecture-diagram"
version = "0.39.0"
edition = "2021"
publish = false

[package.metadata.pax]
title = "Pax Architecture"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "architecture-diagram"
path = "src/main.rs"
required-features = ["standalone"]

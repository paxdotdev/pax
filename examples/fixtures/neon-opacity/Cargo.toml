[package]
publish = false
name = "neon-opacity"
version = "0.39.0"
edition = "2021"
default-run = "neon-opacity"

[package.metadata.pax]
title = "Neon Opacity"
icon = "assets/app-icon.png"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "neon-opacity"
path = "src/main.rs"
required-features = ["standalone"]

[package]
publish = false
name = "route-card"
version = "0.39.1"
edition = "2021"
default-run = "route-card"

[package.metadata.pax]
title = "Route Card"

[dependencies]
pax-kit = { version = "0.39.1", path="../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "route-card"
path = "src/main.rs"
required-features = ["standalone"]

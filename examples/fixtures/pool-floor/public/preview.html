<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pax / Pool floor</title>
<style>
  html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; background: #f4f5ef; }
  iframe { display: block; }
</style>
<iframe id="study" title="Pool floor"></iframe>
<script>
  const frame = document.getElementById("study");
  const source = new URL("./", location.href);
  source.search = location.search;
  source.searchParams.set("pax_suspended", "1");
  const syncVisibility = () => frame.contentWindow?.Pax?.setSuspended(document.hidden);
  frame.addEventListener("load", syncVisibility);
  document.addEventListener("visibilitychange", syncVisibility);
  frame.src = source;
</script>
</html>

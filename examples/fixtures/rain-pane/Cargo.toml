[package]
name = "rain-pane"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "rain-pane"

[package.metadata.pax]
title = "Pax / Rain on dark glass"

[dependencies]
pax-kit = { path = "../../../pax-kit", version = "0.39.1", features = ["shaders"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
naga = { version = "28.0.0", features = ["wgsl-in"] }

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "rain-pane"
path = "src/main.rs"
required-features = ["standalone"]

[package]
publish = false
default-run = "mask-strokes"
name = "mask-strokes"
version = "0.39.0"
edition = "2021"

[package.metadata.pax]
title = "Component Mask Sources"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "mask-strokes"
path = "src/main.rs"
required-features = ["standalone"]

[package]
publish = false
default-run = "shader-studio"
name = "shader-studio"
version = "0.39.0"
edition = "2021"

[package.metadata.pax]
title = "Shader Studio"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit", features = ["shaders"] }

[lib]
crate-type = ["cdylib", "rlib"]


[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "shader-studio"
path = "src/main.rs"
required-features = ["standalone"]

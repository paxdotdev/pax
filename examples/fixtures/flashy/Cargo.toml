[package]
name = "flashy"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "flashy"

[package.metadata.pax]
title = "Pax / Flashy"

[dependencies]
pax-kit = { path = "../../../pax-kit", version = "0.39.1", features = ["shaders"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "flashy"
path = "src/main.rs"
required-features = ["standalone"]

[package]
name = "rim-refraction"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "rim-refraction"

[package.metadata.pax]
title = "Pax / Contour light"

[dependencies]
pax-kit = { path = "../../../pax-kit", version = "0.39.1", features = ["shaders", "3d"] }
pax-website = { path = "../../../pax-website", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "rim-refraction"
path = "src/main.rs"
required-features = ["standalone"]

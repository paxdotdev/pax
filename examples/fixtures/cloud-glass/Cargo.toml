[package]
name = "cloud-glass"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "cloud-glass"

[package.metadata.pax]
title = "Cloud glass · Pax material study"

[dependencies]
pax-kit = { path = "../../../pax-kit", features = ["shaders"] }
pax-website = { path = "../../../pax-website", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "EventTarget"] }
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "cloud-glass"
path = "src/main.rs"
required-features = ["standalone"]

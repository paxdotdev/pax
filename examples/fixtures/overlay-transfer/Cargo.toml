[package]
publish = false
name = "overlay-transfer"
version = "0.39.1"
edition = "2021"
default-run = "overlay-transfer"

[package.metadata.pax]
title = "Overlay Transfer"

[dependencies]
pax-kit = { path = "../../../pax-kit", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "overlay-transfer"
path = "src/main.rs"
required-features = ["standalone"]

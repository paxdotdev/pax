[package]
publish = false
name = "async-workbench"
version = "0.39.0"
edition = "2021"
default-run = "async-workbench"

[package.metadata.pax]
title = "Async Workbench"

[package.metadata.pax.macos.entitlements]
"com.apple.security.network.client" = true
"com.apple.security.network.server" = true

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "async-workbench"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pax-tokio = { path = "../../../pax-tokio" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
pax-web-async = { path = "../../../pax-web-async" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response", "Url", "Location", "Performance", "AbortController", "AbortSignal", "Request", "RequestInit"] }

[lib]
crate-type = ["cdylib", "rlib"]


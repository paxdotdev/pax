[package]
publish = false
default-run = "mesh-gradients"
name = "mesh-gradients"
version = "0.39.1"
edition = "2021"

[package.metadata.pax]
title = "Mesh Gradients"

[dependencies]
pax-kit = { version = "0.39.1", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "mesh-gradients"
path = "src/main.rs"
required-features = ["standalone"]

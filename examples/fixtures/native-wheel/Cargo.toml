[package]
name = "native-wheel"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "native-wheel"

[package.metadata.pax]
title = "Pax native wheel input"

[dependencies]
pax-kit = { path = "../../../pax-kit", version = "0.39.1" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "native-wheel"
path = "src/main.rs"
required-features = ["standalone"]

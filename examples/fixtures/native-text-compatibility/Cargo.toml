[package]
default-run = "native-text-compatibility"
name = "native-text-compatibility"
version = "0.39.0"
edition = "2021"
publish = false

[package.metadata.pax]
title = "Native Text — Compatibility"

[dependencies]
pax-kit = { version = "0.39.0", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "native-text-compatibility"
path = "src/main.rs"
required-features = ["standalone"]

[package]
name = "surface-scheduling"
version = "0.39.1"
edition = "2021"
publish = false
default-run = "surface-scheduling"

[dependencies]
pax-kit = { version = "0.39.1", path = "../../../pax-kit" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone", "designtime"]
standalone = ["pax-kit/host"]
designtime = ["pax-kit/designtime"]

[[bin]]
name = "surface-scheduling"
path = "src/main.rs"
required-features = ["standalone"]

[package]
name = "pax-1013-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
pax-runtime-api = { path = "../../../pax-runtime-api" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"
flexbuffers = "2"
serde_json = "1"

[profile.dev]
debug = 0
incremental = false


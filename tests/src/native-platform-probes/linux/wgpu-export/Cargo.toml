[package]
name = "pax-linux-wgpu-export-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[[test]]
name = "offscreen"
path = "../../../../../pax-gpu/tests/offscreen.rs"

[dependencies]
anyhow = "1"
ash = "0.38"
pollster = "0.4"
pax-gpu = { path = "../../../../../pax-gpu" }
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[profile.dev]
debug = 0

[package]
name = "pax-website"
version = "0.39.0"
edition = "2021"
default-run = "run"
description = "The Pax declarative UI language and Rust GUI framework website"
repository = "https://github.com/paxdotdev/pax"
publish = false

[package.metadata.pax]
title = "Pax — A declarative language for native and web UI"

[package.metadata.pax.web]
server_owned_prefixes = ["/blog", "/ai", "/ai.md"]
title = "Pax — A declarative language for native and web UI"
favicon = "../pax-compiler/files/interfaces/macos/pax-app-macos/pax-app-macos/Assets.xcassets/AppIcon.appiconset/pax-logo-1024.png"
site_name = "Pax"
site_url = "https://pax.dev"
social_image = "pax-favicon.png"
social_image_alt = "Pax logo"

[dependencies]
pax-kit = { version = "0.39.0", path = "../pax-kit" }
pax-logo = { version = "0.39.0", path = "../examples/src/pax-logo" }
calculator = { version = "0.39.0", path = "../examples/src/calculator" }
paxflix = { version = "0.39.0", path = "../examples/src/paxflix" }
# Pest 2.9's stacker/psm path imports an unresolved stack pointer on wasm32.
# Keep this web app's development parser on the working 2.8 series.
pest = "=2.8.7"
pest_derive = "=2.8.7"

[dev-dependencies]
# Verify checked-in paths against the retained experimental shaping helper.
pax-text = { path = "../pax-text" }

[target.'cfg(target_vendor = "apple")'.dependencies]
# backtrace 0.3.76 needs dyld bindings removed from iOS in libc 0.2.190.
libc = "=0.2.189"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.pax-website]
opt-level = 0

[package]
name = "pax-website"
version = "0.39.1"
edition = "2021"
default-run = "run"
description = "The Pax declarative UI language and Rust GUI framework website"
repository = "https://github.com/paxdotdev/pax"
publish = false

[package.metadata.pax]
loader = true
title = "Pax — Build creative user interfaces with Rust"

[package.metadata.pax.web]
yield_mount = true
# The prepared hero starts its animation clock as the loader exits.
loader_exit = "first_viewport"
background_color = "#000000"
server_owned_prefixes = ["/blog", "/ai", "/ai.md", "/paxflix", "/calculator", "/oscilloscope"]
title = "Pax — Build creative user interfaces with Rust"
favicon = "assets/branding/pax-favicon.ico"
site_name = "Pax"
site_url = "https://pax.dev"
social_image = "assets/branding/pax-logo.png"
social_image_alt = "Pax logo"

[features]
default = ["app"]
# Embedded headers share the component source without demo cartridges or filters.
app = ["dep:led-oscilloscope", "dep:calculator", "dep:paxflix", "dep:increment-cube", "dep:rain-pane", "dep:curtain-panel", "dep:glass-bricks", "dep:rand", "dep:percent-encoding", "pax-kit/shaders"]
standalone = ["app", "pax-kit/host"]

[dependencies]
rand = { version = "0.8", optional = true }
percent-encoding = { version = "2", optional = true }
curtain-panel = { version = "0.39.1", path = "../examples/fixtures/curtain-panel", default-features = false, optional = true }
glass-bricks = { version = "0.39.1", path = "../examples/fixtures/glass-bricks", default-features = false, optional = true }
rain-pane = { version = "0.39.1", path = "../examples/fixtures/rain-pane", default-features = false, optional = true }
increment-cube = { version = "0.39.1", path = "../examples/increment-cube", default-features = false, optional = true }
led-oscilloscope = { version = "0.39.1", path = "../examples/led-oscilloscope", default-features = false, optional = true }
pax-kit = { version = "0.39.1", path = "../pax-kit" }
calculator = { version = "0.39.1", path = "../examples/calculator", default-features = false, optional = true }
paxflix = { version = "0.39.1", path = "../examples/paxflix", default-features = false, optional = true }

[build-dependencies]
pulldown-cmark = "0.13"

[dev-dependencies]
pulldown-cmark = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "MediaQueryList", "Element", "EventTarget", "Event"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
# backtrace 0.3.76 needs dyld bindings removed from iOS in libc 0.2.190.
libc = "=0.2.189"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"
required-features = ["app"]

[[bin]]
name = "pax-website"
path = "bin/native.rs"
required-features = ["standalone"]

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.pax-website]
opt-level = 0

[package]
name = "pax-website"
version = "0.39.1"
edition = "2021"
default-run = "run"
description = "The Pax declarative UI language and Rust GUI framework website"
repository = "https://github.com/paxdotdev/pax"
publish = false

[package.metadata.pax]
loader = true
title = "Pax — A declarative language for native and web UI"

[package.metadata.pax.web]
yield_mount = true
background_color = "#11110f"
server_owned_prefixes = ["/blog", "/ai", "/ai.md", "/paxflix", "/calculator"]
title = "Pax — A declarative language for native and web UI"
favicon = "assets/branding/pax-favicon.ico"
site_name = "Pax"
site_url = "https://pax.dev"
social_image = "assets/branding/pax-logo.png"
social_image_alt = "Pax logo"

[dependencies]
led-oscilloscope = { version = "0.39.1", path = "../examples/led-oscilloscope", default-features = false }
pax-kit = { version = "0.39.1", path = "../pax-kit", features = ["shaders"] }
calculator = { version = "0.39.1", path = "../examples/calculator", default-features = false }
paxflix = { version = "0.39.1", path = "../examples/paxflix", default-features = false }

[target.'cfg(target_vendor = "apple")'.dependencies]
# backtrace 0.3.76 needs dyld bindings removed from iOS in libc 0.2.190.
libc = "=0.2.189"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "run"
path = "bin/run.rs"

# Optimize runtime dependencies while keeping application rebuilds fast.
# Build scripts and proc macros keep Cargo's unoptimized defaults.
[profile.dev]
opt-level = 1

[profile.dev.package.pax-website]
opt-level = 0

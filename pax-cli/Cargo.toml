[package]
name = "pax-cli"
version = "0.39.0"
authors = ["Zack Brown <zack@pax.dev>"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://pax.dev/"
repository = "https://www.github.com/paxproject/pax"
description = "Command line interface tool for developing, packaging, and managing Pax projects"

[package.metadata.pax.release]
# Created projects resolve pax-kit even though the CLI binary does not link it.
after = ["pax-kit"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]

[dependencies]
clap = "2.33.3"
color-eyre = "0.6.2"
colored = "2.0.0"
ctrlc = { version = "3.4.4", features = ["termination"] }
nix = "0.20.2"
pax-compiler = {path = "../pax-compiler", version = "0.39.0"}
pax-docs = {path = "../pax-docs", version = "0.39.0"}
pax-language = {path = "../pax-language", version = "0.39.0"}
pax-language-server = {path = "../pax-language-server", version = "0.39.0"}
pax-manifest = {path = "../pax-manifest", version = "0.39.0", features=["json"]}
pax-message = {path = "../pax-message", version = "0.39.0"}
reqwest = { version = "0.11.18", features = ["blocking", "json"] }
rustc_version = "0.4.0"
semver = "1.0"
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.114"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.20", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.9.0"

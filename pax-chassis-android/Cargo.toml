[package]
name = "pax-chassis-android"
version = "0.39.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Android native-window presentation for Pax cartridges"

[dependencies]
pax-chassis-common = { path = "../pax-chassis-common", version = "0.39.1" }
pax-runtime = { path = "../pax-runtime", version = "0.39.1" }
pax-gpu = { path = "../pax-gpu", version = "0.39.1" }
pax-designtime = { path = "../pax-designtime", version = "0.39.1", optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
quick-xml = "0.42"
pollster = "0.4"
raw-window-handle = "0.6"
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[features]
designtime = ["pax-chassis-common/designtime", "dep:pax-designtime"]

[package]
name = "pax"
version = "0.39.0"
authors = ["Zack Brown <zack@pax.dev>", "Warfa Jibril <warfa@pax.dev>", "Samuel Selleck <samuel@pax.dev>"]
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    "examples/*",
    "pax-chassis-common",
    "pax-chassis-ios",
    "pax-chassis-macos",
    "pax-chassis-web",
    "pax-cli",
    "pax-compiler",
    "pax-codegen",
    "pax-docs",
    "pax-designtime",
    "pax-engine",
    "pax-kit",
    "pax-host",
    "pax-language",
    "pax-language-server",
    "pax-macro",
    "pax-manifest",
    "pax-message",
    "pax-runtime",
    "pax-runtime-api",
    "pax-tokio",
    "pax-web-async",
    "pax-std",
    "pax-gpu",
]

exclude = [
    "pax-compiler/files",
    "pax-website",
    "tests",
]

# Keep rendering responsive in debug builds while application edits compile quickly.
[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

[profile.dev.package.adaptive-cards]
opt-level = 0

[profile.dev.package.architecture-diagram]
opt-level = 0

[profile.dev.package.async-workbench]
opt-level = 0

[profile.dev.package.auto-sized-containers]
opt-level = 0

[profile.dev.package.breakout]
opt-level = 0


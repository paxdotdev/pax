[package]
name = "pax"
version = "0.39.1"
authors = ["Zack Brown <zack@pax.dev>", "Warfa Jibril <warfa@pax.dev>", "Samuel Selleck <samuel@pax.dev>"]
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    "examples/calculator",
    "examples/increment",
    "examples/ink-and-light",
    "examples/liquid-glass",
    "examples/living-quilt",
    "examples/materials",
    "examples/pax-logo",
    "examples/paxflix",
    "examples/viewport-proximity",
    "examples/fixtures/*",
    "pax-chassis-common",
    "pax-chassis-ios",
    "pax-chassis-macos",
    "pax-chassis-web",
    "pax-cli",
    "pax-compiler",
    "pax-codegen",
    "pax-docs",
    "pax-designtime",
    "pax-engine",
    "pax-kit",
    "pax-host",
    "pax-language",
    "pax-language-server",
    "pax-macro",
    "pax-manifest",
    "pax-message",
    "pax-runtime",
    "pax-runtime-api",
    "pax-tokio",
    "pax-web-async",
    "pax-std",
    "pax-gpu",
]

exclude = [
    "pax-compiler/files",
    "pax-website",
    "tests",
]

# Keep rendering responsive in debug builds while application edits compile quickly.
[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

[profile.dev.package.adaptive-cards]
opt-level = 0

[profile.dev.package.architecture-diagram]
opt-level = 0

[profile.dev.package.async-workbench]
opt-level = 0

[profile.dev.package.auto-sized-containers]
opt-level = 0

[profile.dev.package.breakout]
opt-level = 0

[profile.dev.package.calculator]
opt-level = 0

[profile.dev.package.color-picker]
opt-level = 0

[profile.dev.package.dynamic-linking-lab]
opt-level = 0

[profile.dev.package.example-host]
opt-level = 0

[profile.dev.package.fireworks]
opt-level = 0

[profile.dev.package.game-of-life]
opt-level = 0

[profile.dev.package.glow-buttons]
opt-level = 0


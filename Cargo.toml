opt-level = 0

[profile.dev.package.gyro-helper]
opt-level = 0

[profile.dev.package.increment]
opt-level = 0

[profile.dev.package.ink-and-light]
opt-level = 0

[profile.dev.package.liquid-glass]
opt-level = 0

[profile.dev.package.living-quilt]
opt-level = 0


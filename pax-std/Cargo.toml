
[package]
name = "pax-std"
version = "0.39.1"
authors = ["Zack Brown <zack@pax.dev>"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://pax.dev/"
repository = "https://www.github.com/paxproject/pax"
description = "Standard library for Pax, including layouts, drawing primitives, and form controls"

[dependencies]
kurbo = "0.11.1"
lazy_static = "1.4.0"
log = "0.4.20"
pax-engine = {path = "../pax-engine", version="0.39.1"}
pax-language = {path = "../pax-language", version="0.39.1", default-features = false}
pax-manifest = {path = "../pax-manifest", version="0.39.1"}
pax-message = {path = "../pax-message", version="0.39.1"}
pax-runtime = {path = "../pax-runtime", version="0.39.1"}
serde = { version = "1.0.159", features=["derive"]}

[features]
# Opt-in GPU subtree filters, including runtime WGSL validation.
shaders = ["pax-engine/shaders", "pax-runtime/shaders"]
designtime = ["pax-language/parser", "pax-engine/designtime", "pax-runtime/designtime"]

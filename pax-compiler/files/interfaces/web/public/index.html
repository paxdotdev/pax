<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        >
        <title>Pax Web</title>
        <style>html, body, #mount { margin: 0; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; }</style>
        <script>
            // Query-backed embeds load the bundle beside their physical entry document,
            // regardless of the public site's canonical URL or the selected app route.
            if (new URLSearchParams(window.location.search).has("pax_route")) {
                const base = document.querySelector("base") || document.createElement("base");
                base.href = new URL(".", window.location.href).href;
                document.head.prepend(base);
            }
        </script>
    </head>
    <body>
        <div id="mount">
        </div>
        <script src="pax-interface-web.js" ></script>
        <script>
            if (window.Pax && typeof window.Pax.init_web === 'function') {
                const cartridgeUrl = new URL("pax-cartridge", document.baseURI);
                window.Pax.init_web({ element: document.getElementById("mount"), cartridgeUrl: cartridgeUrl.href, pageScroll: true, documentRouting: true })
                    .then(app => { window.paxApp = app; })
                    .catch(error => console.error("Pax initialization failed", error));
            } else {
                console.error("Pax cartridge failed to load or was malformed.");
            }
        </script>
    </body>
</html>

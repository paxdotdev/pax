<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        >
        <title>Pax Web</title>
    </head>
    <body>
        <link rel="stylesheet" href="https://use.typekit.net/ivu7epf.css">
        <div id="mount">
        </div>
        <script src="pax-interface-web.js" ></script>
        <script>
            if (typeof window.Pax.mount === 'function') {
                const cartridgeUrl = new URL("pax-cartridge", window.location.href);
                window.Pax.mount("#mount", cartridgeUrl.href);
            } else {
                console.error("Pax cartridge failed to load or was malformed.");
            }
        </script>
    </body>
</html>

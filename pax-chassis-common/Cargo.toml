[package]
name = "pax-chassis-common"
version = "0.39.0"
authors = ["Zack Brown <zack@pax.dev>"]
edition = "2021"
description = "Shared resources for Pax Chassis"
license = "MIT OR Apache-2.0"
homepage = "https://pax.dev/"
repository = "https://www.github.com/paxproject/pax"
include = ["src/**/*","pax-swift-common/**/*"]
exclude = ["pax-swift-common/.build"]

[lib]

[dependencies]
env_logger = "0.11.1"
log = "0.4.21"
piet = "0.7.0"
piet-coregraphics = "0.7.0"
pax-runtime = { path = "../pax-runtime", version="0.39.0" }
pax-message = {path = "../pax-message", version="0.39.0"}
pax-gpu = { path = "../pax-gpu", version="0.39.0" }
pax-designtime = { path = "../pax-designtime", version="0.39.0", optional = true }
pax-manifest = { path = "../pax-manifest", version="0.39.0", optional = true }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.95"
lazy_static = "1.4.0"
mut_static = "5.0.0"
pollster = "0.4.0"
#be cautious about core-graphics' version number --
#ideally this would be locked with `piet` (the specified version should exactly match the version used
#internally by piet-coregraphics, e.g. 0.7.0 => 0.24.0)
core-graphics = "0.24.0"
flexbuffers = "2.0.0"

[features]
designtime = ["dep:pax-designtime", "dep:pax-manifest", "pax-runtime/designtime"]

[package]
name = "pax-chassis-common"
version = "0.39.1"
authors = ["Zack Brown <zack@pax.dev>"]
edition = "2021"
description = "Shared resources for Pax Chassis"
license = "MIT OR Apache-2.0"
homepage = "https://pax.dev/"
repository = "https://www.github.com/paxproject/pax"
include = ["src/**/*","pax-swift-common/**/*"]
exclude = ["pax-swift-common/.build"]

[lib]

[dependencies]
env_logger = "0.11.1"
log = "0.4.21"
pax-runtime = { path = "../pax-runtime", version="0.39.1" }
pax-message = {path = "../pax-message", version="0.39.1"}
pax-gpu = { path = "../pax-gpu", version="0.39.1" }
pax-designtime = { path = "../pax-designtime", version="0.39.1", optional = true }
pax-manifest = { path = "../pax-manifest", version="0.39.1", optional = true }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.95"
lazy_static = "1.4.0"
mut_static = "5.0.0"
pollster = "0.4.0"
flexbuffers = "2.0.0"

[features]
designtime = ["dep:pax-designtime", "dep:pax-manifest", "pax-runtime/designtime"]
